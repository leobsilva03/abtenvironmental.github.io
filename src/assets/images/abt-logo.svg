<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .logo-brand { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Three-Leaf Foliage Emblem matching IMG_4645 -->
  <g id="emblem">
    <!-- Bottom Stem Chevron Notch -->
    <path 
      d="M 108 182 L 125 218 L 142 182" 
      fill="none" 
      stroke="#0f382c" 
      stroke-width="7.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Center Upright Leaf -->
    <path 
      d="M 125 14 C 78 68 70 138 125 186 C 180 138 172 68 125 14 Z" 
      fill="none" 
      stroke="#0f382c" 
      stroke-width="7.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Center Leaf Vein -->
    <path 
      d="M 125 54 L 125 184" 
      fill="none" 
      stroke="#0f382c" 
      stroke-width="6.5" 
      stroke-linecap="round"
    />

    <!-- Left Outstretched Leaf -->
    <path 
      d="M 122 184 C 70 184 20 136 28 88 C 30 74 42 66 58 64 C 80 62 108 108 122 184 Z" 
      fill="none" 
      stroke="#0f382c" 
      stroke-width="7.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Left Leaf Center Vein -->
    <path 
      d="M 52 74 L 118 174" 
      fill="none" 
      stroke="#0f382c" 
      stroke-width="6.5" 
      stroke-linecap="round"
    />

    <!-- Right Outstretched Leaf -->
    <path 
      d="M 128 184 C 180 184 230 136 222 88 C 220 74 208 66 192 64 C 170 62 142 108 128 184 Z" 
      fill="none" 
      stroke="#0f382c" 
      stroke-width="7.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Right Leaf Center Vein -->
    <path 
      d="M 198 74 L 132 174" 
      fill="none" 
      stroke="#0f382c" 
      stroke-width="6.5" 
      stroke-linecap="round"
    />
  </g>

  <!-- Typography: ABT Environmental / ASBESTOS | LEAD | MOULD -->
  <g fill="#0f382c" class="logo-brand">
    <text 
      x="274" 
      y="74" 
      font-size="76" 
      font-weight="800" 
      letter-spacing="-0.02em"
    >
      ABT
    </text>

    <text 
      x="274" 
      y="152" 
      font-size="68" 
      font-weight="700" 
      letter-spacing="-0.025em"
    >
      Environmental
    </text>

    <text 
      x="276" 
      y="208" 
      font-size="24" 
      font-weight="700" 
      letter-spacing="0.25em"
    >
      ASBESTOS &nbsp;&nbsp;|&nbsp;&nbsp; LEAD &nbsp;&nbsp;|&nbsp;&nbsp; MOULD
    </text>
  </g>
</svg>
